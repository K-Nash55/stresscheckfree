<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スーパーアドミン ログイン</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  background: #f0f2f5;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
  padding: 32px;
  width: 100%;
  max-width: 340px;
}
.badge {
  background: #e74c3c;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
  display: inline-block;
  margin-bottom: 12px;
}
h1 { margin: 0 0 20px; font-size: 18px; color: #1a1a2e; }
label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
input[type="email"], input[type="password"] {
  width: 100%; border: 1px solid #ddd; border-radius: 4px;
  padding: 8px 10px; font-size: 14px; margin-bottom: 16px;
}
.login-btn {
  width: 100%; background: #1a1a2e; color: #fff; border: none;
  padding: 10px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
}
.login-btn:hover { background: #2c3e50; }
.login-btn:disabled { background: #ccc; cursor: not-allowed; }
.error-msg { color: #e74c3c; font-size: 12px; margin: -8px 0 16px; min-height: 16px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body>

<div class="card">
  <span class="badge">SUPER ADMIN</span>
  <h1>スーパーアドミン ログイン</h1>
  <form id="loginForm">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">パスワード</label>
    <input type="password" id="password" required autocomplete="current-password">
    <div class="error-msg" id="errorMsg"></div>
    <button type="submit" class="login-btn" id="loginBtn">ログイン</button>
  </form>
</div>

<script>
var ALLOWED_EMAIL = 'ken.nakanishi02@gmail.com';
var redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'super_dashboard.html';

(async function checkExistingSession() {
  var { data } = await supabase.auth.getSession();
  var session = data && data.session;
  if (session && session.user && session.user.email === ALLOWED_EMAIL) {
    window.location.href = redirectTo;
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var errorMsg = document.getElementById('errorMsg');
  var loginBtn = document.getElementById('loginBtn');

  errorMsg.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'ログイン中…';

  var res = await supabase.auth.signInWithPassword({ email: email, password: password });

  if (res.error) {
    errorMsg.textContent = 'メールアドレスまたはパスワードが正しくありません。';
    loginBtn.disabled = false;
    loginBtn.textContent = 'ログイン';
    return;
  }

  if (res.data.user.email !== ALLOWED_EMAIL) {
    await supabase.auth.signOut();
    errorMsg.textContent = 'このアカウントにはアクセス権限がありません。';
    loginBtn.disabled = false;
    loginBtn.textContent = 'ログイン';
    return;
  }

  window.location.href = redirectTo;
});
</script>

</body>
</html>
